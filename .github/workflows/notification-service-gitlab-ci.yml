name: CI/CD Notification Service

on:
  push:
    branches:
      - master
    paths:
      - 'notification-service/**'
      # changes in dependencies might influence on notification-service
      - 'order-contract/**'
      # parent pom might influence on notification-service
      - 'pom.xml'
      - 'helm/applications/notification-service/**'
      - '.github/workflows/notification-service-gitlab-ci.yml'

jobs:
  build:
    name: Build, Push Docker Image
    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify -DskipTests -pl notification-service -am

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t krevskiigrigorii/notification-service:${{ github.sha }} notification-service

      - name: Push Docker image
        run: |
          docker push krevskiigrigorii/notification-service:${{ github.sha }}
  
  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on:
      - self-hosted
      - windows
    env:
      KUBECONFIG: ${{ github.workspace }}\kubeconfig.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        shell: powershell
        run: |
            "${{ secrets.KUBECONFIG_CONTENT }}" | Out-File `
            -FilePath $env:KUBECONFIG `
            -Encoding utf8

      - name: Kubernetes check
        run: |
            kubectl get nodes

      - name: Deploy with Helm
        run: |
          helm upgrade --install notification-service ./helm/applications/notification-service --set image.tag=${{ github.sha }} --namespace apps
#          --set image.repository=krevskiigrigorii/notification-service \
#          --set image.tag=latest \
#          --namespace default \
#          --create-namespace
